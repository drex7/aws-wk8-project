name: Dev Pipeline

on:
  push:
    branches:
      - 'dev'

env:
  SAM_TEMPLATE: template.yaml
  STACK_NAME: s3-sns-dev
  PIPELINE_EXECUTION_ROLE: arn:aws:iam::605134436600:role/aws-sam-cli-managed-dev-pipel-PipelineExecutionRole-mVIQvC2b1ps9
  CLOUDFORMATION_EXECUTION_ROLE: arn:aws:iam::605134436600:role/aws-sam-cli-managed-dev-p-CloudFormationExecutionRo-vtgQSXlGijaJ
  ARTIFACTS_BUCKET: aws-sam-cli-managed-dev-pipeline-r-artifactsbucket-srhclqjttd3t
  REGION: eu-central-1

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build SAM Application
        run: sam build --template ${SAM_TEMPLATE} --use-container

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.REGION }}
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          role-session-name: dev-deployment
          role-duration-seconds: 3600

      - name: Package and deploy to dev stack
        run: |
          sam package 

          sam deploy \
            --config-env dev \
            --role-arn ${CLOUDFORMATION_EXECUTION_ROLE} \
            --no-fail-on-empty-changeset