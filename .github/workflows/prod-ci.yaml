name: Prod Pipeline

on:
  push:
    branches:
      - 'main'

env:
  SAM_TEMPLATE: template.yaml
  STACK_NAME: s3-sns-prod
  PIPELINE_EXECUTION_ROLE: arn:aws:iam::101067743333:role/aws-sam-cli-managed-prod-pipe-PipelineExecutionRole-reQpmKGGzvMw
  CLOUDFORMATION_EXECUTION_ROLE: arn:aws:iam::101067743333:role/aws-sam-cli-managed-prod--CloudFormationExecutionRo-VPZ2H15pFqki
  ARTIFACTS_BUCKET: aws-sam-cli-managed-prod-pipeline--artifactsbucket-ygol9kl4mteq
  REGION: eu-central-1

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build SAM Application
        run: sam build --template ${SAM_TEMPLATE} --use-container

      - name: Assume the prod pipeline role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.REGION }}
          role-to-assume: ${{ env.PIPELINE_EXECUTION_ROLE }}
          role-session-name: prod-deployment
          role-duration-seconds: 3600

      - name: Package and deploy to prod stack
        run: |
          sam package \
            --config-env prod 

          sam deploy \
            --config-env prod \
            --role-arn ${CLOUDFORMATION_EXECUTION_ROLE} \
            --no-fail-on-empty-changeset \
            --disable-rollback